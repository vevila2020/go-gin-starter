server:
  port: 8080
  mode: release
  app_name: go-gin-starter
  allowed_origins:
    - "*"
  read_timeout: 30
  write_timeout: 30
  request_timeout: 30

database:
  enabled: true
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: root
  database: myapp
  ssl_mode: disable
  time_zone: Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  auto_migrate: true

redis:
  enabled: false
  host: localhost
  port: 6379
  password: ''
  db: 0
  pool_size: 10
  min_idle_conns: 5

log:
  level: info
  filename: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
  console: true